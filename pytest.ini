[pytest]
testpaths = tests/integration tests/indexing tests/reconciliation tests/transfers tests/load
# tests/ for lib and conftest, services/ for the indexer package
pythonpath = tests services
addopts = -ra --strict-markers
timeout = 120
markers =
    req(id): requirement ID covered by the test (INT-, IDX-, REC-, TAPI-, LOAD-, UI-xx), also shown in the Allure report
filterwarnings =
    # third-party: web3 imports websockets.legacy; nothing in this repo uses it
    ignore:websockets.legacy is deprecated:DeprecationWarning
    # third-party: pytest-playwright 0.10.0 defines a session fixture as a method
    ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning
