[pytest]
testpaths = tests/integration
pythonpath = tests
addopts = -ra --strict-markers
timeout = 120
markers =
    req(id): requirement ID covered by the test (INT-xx), also shown in the Allure report
filterwarnings =
    # third-party: web3 imports websockets.legacy; nothing in this repo uses it
    ignore:websockets.legacy is deprecated:DeprecationWarning
