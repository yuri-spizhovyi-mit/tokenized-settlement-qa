[pytest]
testpaths = tests/integration tests/indexing tests/reconciliation tests/transfers
# tests/ for lib and conftest, services/ for the indexer package
pythonpath = tests services
addopts = -ra --strict-markers
timeout = 120
markers =
    req(id): requirement ID covered by the test (INT-, IDX-, REC-, TAPI-xx), also shown in the Allure report
filterwarnings =
    # third-party: web3 imports websockets.legacy; nothing in this repo uses it
    ignore:websockets.legacy is deprecated:DeprecationWarning
