[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Offline mode is never committed here: CI's foundry-toolchain downloads
# solc normally. scripts/cloud-setup.sh sets `offline = true` and the
# local solc path in the global ~/.foundry/foundry.toml instead.

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false
show_metrics = true

# CI: 10,000 fuzz runs per property and a deeper invariant campaign. Local runs keep
# the defaults above for a fast loop; run `FOUNDRY_PROFILE=ci forge test` to match CI.
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 256

[fmt]
line_length = 100
