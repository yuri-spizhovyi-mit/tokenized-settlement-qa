name: ui

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job name stable: it is meant to be a required status check.
  ui:
    name: ui (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in step with FOUNDRY_VERSION in scripts/cloud-setup.sh.
          version: v1.8.7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The Chromium build that matches the pinned playwright package.
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Build contracts
        working-directory: contracts
        run: forge build

      # Not in pytest.ini testpaths: the integration job has no browser.
      - name: UI tests (Playwright + mock EIP-1193 wallet + Anvil)
        run: >-
          pytest tests/ui --tracing retain-on-failure --screenshot only-on-failure
          --output test-results

      # Only failed tests leave traces. Open one with: playwright show-trace trace.zip
      - name: Upload traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 14
