name: contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    name: forge build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in step with FOUNDRY_VERSION in scripts/cloud-setup.sh.
          version: v1.8.7

      - name: Show versions
        run: forge --version

      - name: Build (with contract sizes)
        run: forge build --sizes

      # Unit, fuzz (10,000 runs) and invariant suites under the ci profile.
      # Fork tests run in the fork job below.
      - name: Test
        run: forge test -vvv --no-match-path 'test/fork/*'

      # Fails if any unit test's gas differs from the committed contracts/.gas-snapshot.
      # Scoped to test/unit: fuzz and invariant gas depends on random inputs and run
      # counts, so it can't be pinned. After an intended gas change, run
      # `forge snapshot --match-path 'test/unit/*'` and commit the result.
      - name: Gas snapshot
        run: forge snapshot --check --match-path 'test/unit/*'

  # Static analysis gate: fails on any High finding outside lib/, test/ and the
  # deliberately vulnerable fixtures in src/vulnerable/ (contracts/slither.config.json).
  # Every finding, gated or not, is triaged in docs/slither-triage.md.
  slither:
    name: slither (fail on high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      # Slither reads these artifacts instead of compiling inside its container.
      - name: Build with build info
        working-directory: contracts
        run: forge build --build-info --skip './test/**' --skip './script/**'

      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-version: 0.11.6
          slither-config: contracts/slither.config.json
          ignore-compile: true
          fail-on: high

  # Secrets can't be read in a job-level `if`, so a gate job turns "is the secret
  # set?" into an output. PRs from forks get no secrets, and their fork job is skipped.
  fork-gate:
    name: fork tests enabled?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -n "$MAINNET_RPC_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Fork tests skipped::MAINNET_RPC_URL secret is not set"
          fi

  fork:
    name: forge fork tests (mainnet USDC)
    needs: fork-gate
    if: needs.fork-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
          # The toolchain caches ~/.foundry/cache/rpc too, but keyed per commit. Off here
          # so the pinned-block cache below is the only one (docs/findings.md, F-06).
          cache: false

      # The fork is pinned to a block, so cached RPC state stays valid across runs and
      # commits. Bump the key together with FORK_BLOCK in the fork test.
      - name: Cache fork RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-mainnet-21000000

      - name: Fork tests
        run: forge test -vvv --match-path 'test/fork/*'
